name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bachatcheck
          POSTGRES_PASSWORD: bachatcheck
          POSTGRES_DB: bachatcheck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bachatcheck" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bachatcheck:bachatcheck@localhost:5432/bachatcheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ingestion/pyproject.toml
      - name: Install
        run: |
          pip install -e "backend[dev]"
          pip install -e "ingestion[dev]"
      - name: Ruff
        run: |
          ruff check backend ingestion
          ruff format --check backend ingestion
      - name: Mypy
        run: |
          (cd backend && mypy bachatcheck tests)
          (cd ingestion && mypy ingestion tests scripts)
      - name: Migrations apply cleanly
        working-directory: backend
        run: alembic upgrade head
      - name: Tests
        run: |
          (cd backend && pytest -q)
          (cd ingestion && pytest -q)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
