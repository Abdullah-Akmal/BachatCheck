# Local dev: `docker compose up` → Postgres :5432, API :8000 (/docs), web :3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bachatcheck
      POSTGRES_PASSWORD: bachatcheck  # local-only dev password
      POSTGRES_DB: bachatcheck
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bachatcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://bachatcheck:bachatcheck@db:5432/bachatcheck
      CORS_ORIGINS: http://localhost:3000
      DATA_DIR: /data
    command: sh -c "alembic upgrade head && uvicorn bachatcheck.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app", "./data:/data:ro"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      # Browser-side calls go to the host; server-side calls go over the compose network.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL_INTERNAL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

  # On-demand jobs:  docker compose run --rm ingestion run sbp
  ingestion:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://bachatcheck:bachatcheck@db:5432/bachatcheck
    volumes:
      - ./backend:/repo/backend
      - ./ingestion:/repo/ingestion
      - ./data:/repo/data
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
